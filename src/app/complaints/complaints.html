<!-- ================= COMPLAINTS ================= -->

   <!-- Complaint table -->
  <div  class="table-container">
    <table class="complaints-table">
      <thead>
        <tr>
          <th>Complaint ID</th>
          <th>Title</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let c of complaints">
          <td>
            <a [routerLink]="['/complaint', c.ComplaintId ]" [state]="{ complaint: c }">

              {{ c.ComplaintId || c.complaintId }}
            </a>
          </td>
          <td>
            {{ c.Title || c.title }}
          </td>
          <td [ngClass]="{
              'status-open': (c.StatusName ) === 'Open',
              'status-progress': (c.StatusName ) === 'In Progress',
              'status-closed': (c.StatusName ) === 'Closed'
            }">
            {{ c.StatusName || c.statusName }}
          </td>
        </tr>
      </tbody>
    </table>


    <!-- ================= PAGINATION ================= -->

    <div class="pagination-wrapper">
      <div class="pagination-info">
        Showing
        <strong>
          {{ totalComplaints === 0 ? 0 : ((page - 1) * pageSize) + 1 }}
        </strong>
        -
        <strong>
          {{ getEndRecord() }}
        </strong>
        of
        <strong>{{ totalComplaints }}</strong>
      </div>

      <div class="pagination-controls">

        <ngb-pagination [collectionSize]="totalComplaints" [(page)]="page" [pageSize]="pageSize" [maxSize]="5"
          [rotate]="true" [ellipses]="true" [boundaryLinks]="true" (pageChange)="onPageChange($event)">
        </ngb-pagination>
        <select [ngModel]="pageSize" (ngModelChange)="onPageSizeChange($event)">
          <option [ngValue]="5">5</option>
          <option [ngValue]="10">10</option>
          <option [ngValue]="20">20</option>
          <option [ngValue]="50">50</option>
        </select>
      </div>
  </div>
</div>
