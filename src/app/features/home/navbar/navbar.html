<nav class="navbar navbar-expand-lg sticky-top py-3" id="nbar">
  <div class="container">

<!-- LOGO -->
<a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-4 tx-main"
   routerLink="/">

  <div class="logo-box">
    <i class="bi bi-building-fill fs-5"></i>
  </div>

  <span>Fix<span class="gt">MyCity</span></span>
</a>


<!-- MOBILE TOGGLER -->
<button
  class="navbar-toggler border-0 tx-main"
  type="button"
  data-bs-toggle="collapse"
  data-bs-target="#mainNavbar">

  <i class="bi bi-list fs-2"></i>
</button>


<!-- NAVIGATION -->
<div class="collapse navbar-collapse" id="mainNavbar">

  <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-lg-1">

    <li class="nav-item">
      <a class="nav-link px-3 py-2 tx-soft fw-medium"
         routerLink="/">
        <i class="bi bi-house-door-fill me-1"></i>
        Home
      </a>
    </li>

    <li class="nav-item">
      <a class="nav-link px-3 py-2 tx-soft fw-medium"
         routerLink="/"
         fragment="services">
        <i class="bi bi-grid-fill me-1"></i>
        Services
      </a>
    </li>

    <li class="nav-item">
      <a class="nav-link px-3 py-2 tx-soft fw-medium"
         routerLink="/"
         fragment="how-it-works">
        <i class="bi bi-diagram-3-fill me-1"></i>
        Process
      </a>
    </li>

    <li class="nav-item">
      <a class="nav-link px-3 py-2 tx-soft fw-medium"
         routerLink="/about">
        <i class="bi bi-info-circle-fill me-1"></i>
        About
      </a>
    </li>

    <li class="nav-item">
      <a class="nav-link px-3 py-2 tx-soft fw-medium"
         routerLink="/contact">
        <i class="bi bi-envelope-fill me-1"></i>
        Contact Us
      </a>
    </li>

  </ul>


  <!-- RIGHT SIDE -->
  <div class="d-flex align-items-center gap-2">

    <!-- THEME -->
    <button
      type="button"
      class="btn boc px-3 py-2 d-flex align-items-center gap-2"
      (click)="toggleTheme()">

      <i
        class="bi"
        [ngClass]="isLight ? 'bi-sun-fill text-warning' : 'bi-moon-stars-fill text-info'">
      </i>

      <span class="small fw-semibold">
        {{ isLight ? 'Light' : 'Dark' }}
      </span>
    </button>


    <!-- LOGGED IN -->
    @if (isLoggedIn) {

      <a
        routerLink="/complaints"
        class="btn boc px-3 py-2">

        <i class="bi bi-list-task me-1"></i>
        Dashboard
      </a>

      <button
        type="button"
        class="btn btn-outline-danger px-3 py-2 rounded-3"
        (click)="logout()">

        <i class="bi bi-box-arrow-right me-1"></i>
        Logout
      </button>

    }

    <!-- NOT LOGGED IN -->
    @else {

      <a
        routerLink="/login"
        class="btn boc px-3 py-2">

        <i class="bi bi-person-fill me-1"></i>
        Log In
      </a>

      <a
        routerLink="/register"
        class="btn bgrd px-4 py-2">

        <i class="bi bi-plus-circle-fill me-1"></i>
        Register Citizen
      </a>

    }

  </div>

</div>

  </div>
</nav>
